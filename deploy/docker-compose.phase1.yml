version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multivendor}
      POSTGRES_USER: ${POSTGRES_USER:-multivendor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multivendor} -d ${POSTGRES_DB:-multivendor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: mvp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: mvp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "\"Authorized access only\""
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mvp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - app_net

  postgres_backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: mvp-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-multivendor}
      POSTGRES_USER: ${POSTGRES_USER:-multivendor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-6}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  api:
    image: ${API_IMAGE:-ghcr.io/example/multivendor-api:latest}
    container_name: mvp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_URL: ${APP_URL:-https://app.example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multivendor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multivendor}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-multivendor}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Dhaka}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - app_net

  store_web:
    image: ${STORE_WEB_IMAGE:-ghcr.io/example/multivendor-store-web:latest}
    container_name: mvp-store-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Multi Vendor Platform}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.example.com/v1}
      TZ: ${TZ:-Asia/Dhaka}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${STORE_WEB_PORT:-3000}:3000"
    networks:
      - app_net

  admin_web:
    image: ${ADMIN_WEB_IMAGE:-ghcr.io/example/multivendor-admin-web:latest}
    container_name: mvp-admin-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_ADMIN_APP_NAME:-Multi Vendor Admin}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.example.com/v1}
      TZ: ${TZ:-Asia/Dhaka}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${ADMIN_WEB_PORT:-3002}:3002"
    networks:
      - app_net

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  minio_data:
  postgres_backups:

networks:
  app_net:
    driver: bridge
