# ──────────────────────────────────────────────
# Market One BD — Dokploy Deployment Compose
# Server: Hostinger KVM2 (72.62.254.192)
# Domain: marketone.appbrainer.tech
# Deploy: docker compose -f docker-compose.dokploy.yml up -d
# ──────────────────────────────────────────────

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-multivendor}"
      POSTGRES_USER: "${POSTGRES_USER:-multivendor}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multivendor} -d ${POSTGRES_DB:-multivendor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_URL: "${APP_URL:-https://app.marketone.appbrainer.tech}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-multivendor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multivendor}"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-s3}"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "${S3_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-multivendor}"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      BOOTSTRAP_TENANT_CODE: "${BOOTSTRAP_TENANT_CODE}"
      BOOTSTRAP_TENANT_NAME: "${BOOTSTRAP_TENANT_NAME}"
      BOOTSTRAP_PLATFORM_OWNER_NAME: "${BOOTSTRAP_PLATFORM_OWNER_NAME}"
      BOOTSTRAP_PLATFORM_OWNER_EMAIL: "${BOOTSTRAP_PLATFORM_OWNER_EMAIL}"
      BOOTSTRAP_PLATFORM_OWNER_PASSWORD: "${BOOTSTRAP_PLATFORM_OWNER_PASSWORD}"
      BOOTSTRAP_PLATFORM_ADMIN_NAME: "${BOOTSTRAP_PLATFORM_ADMIN_NAME}"
      BOOTSTRAP_PLATFORM_ADMIN_EMAIL: "${BOOTSTRAP_PLATFORM_ADMIN_EMAIL}"
      BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: "${BOOTSTRAP_PLATFORM_ADMIN_PASSWORD}"
      BOOTSTRAP_STORE_OWNER_NAME: "${BOOTSTRAP_STORE_OWNER_NAME}"
      BOOTSTRAP_STORE_OWNER_EMAIL: "${BOOTSTRAP_STORE_OWNER_EMAIL}"
      BOOTSTRAP_STORE_OWNER_PHONE: "${BOOTSTRAP_STORE_OWNER_PHONE}"
      BOOTSTRAP_STORE_OWNER_PASSWORD: "${BOOTSTRAP_STORE_OWNER_PASSWORD}"
      BOOTSTRAP_STORE_CODE: "${BOOTSTRAP_STORE_CODE}"
      BOOTSTRAP_STORE_NAME: "${BOOTSTRAP_STORE_NAME}"
      BOOTSTRAP_STORE_SLUG: "${BOOTSTRAP_STORE_SLUG}"
      BOOTSTRAP_STORE_PHONE: "${BOOTSTRAP_STORE_PHONE}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketone-api.rule=Host(`api.marketone.appbrainer.tech`)"
      - "traefik.http.routers.marketone-api.entrypoints=websecure"
      - "traefik.http.routers.marketone-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.marketone-api.loadbalancer.server.port=4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - dokploy

  login_web:
    build:
      context: .
      dockerfile: Dockerfile.login
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.marketone.appbrainer.tech}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.marketone.appbrainer.tech/v1}
        API_BASE_URL: http://api:4000/v1
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-https://admin.marketone.appbrainer.tech}
        NEXT_PUBLIC_STORE_APP_URL: ${NEXT_PUBLIC_STORE_APP_URL:-https://app.marketone.appbrainer.tech}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.marketone.appbrainer.tech}"
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-https://api.marketone.appbrainer.tech/v1}"
      API_BASE_URL: "http://api:4000/v1"
      NEXT_PUBLIC_ADMIN_APP_URL: "${NEXT_PUBLIC_ADMIN_APP_URL:-https://admin.marketone.appbrainer.tech}"
      NEXT_PUBLIC_STORE_APP_URL: "${NEXT_PUBLIC_STORE_APP_URL:-https://app.marketone.appbrainer.tech}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketone-login.rule=Host(`marketone.appbrainer.tech`)"
      - "traefik.http.routers.marketone-login.entrypoints=websecure"
      - "traefik.http.routers.marketone-login.tls.certResolver=letsencrypt"
      - "traefik.http.services.marketone-login.loadbalancer.server.port=3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - dokploy

  admin_web:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.marketone.appbrainer.tech/v1}
        NEXT_PUBLIC_LOGIN_APP_URL: ${NEXT_PUBLIC_LOGIN_APP_URL:-https://marketone.appbrainer.tech}
        API_BASE_URL: http://api:4000/v1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_BASE_URL: "http://api:4000/v1"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_LOGIN_APP_URL: "${NEXT_PUBLIC_LOGIN_APP_URL:-https://marketone.appbrainer.tech}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketone-admin.rule=Host(`admin.marketone.appbrainer.tech`)"
      - "traefik.http.routers.marketone-admin.entrypoints=websecure"
      - "traefik.http.routers.marketone-admin.tls.certResolver=letsencrypt"
      - "traefik.http.services.marketone-admin.loadbalancer.server.port=3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - dokploy

  store_web:
    build:
      context: .
      dockerfile: Dockerfile.store
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.marketone.appbrainer.tech/v1}
        NEXT_PUBLIC_LOGIN_APP_URL: ${NEXT_PUBLIC_LOGIN_APP_URL:-https://marketone.appbrainer.tech}
        API_BASE_URL: http://api:4000/v1
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Market One BD}
        NEXT_PUBLIC_PRINT_AGENT_URL: ${NEXT_PUBLIC_PRINT_AGENT_URL:-http://127.0.0.1:17658}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      API_BASE_URL: "http://api:4000/v1"
      NEXT_PUBLIC_LOGIN_APP_URL: "${NEXT_PUBLIC_LOGIN_APP_URL:-https://marketone.appbrainer.tech}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketone-store-app.rule=Host(`app.marketone.appbrainer.tech`) || Host(`store.marketone.appbrainer.tech`)"
      - "traefik.http.routers.marketone-store-app.entrypoints=websecure"
      - "traefik.http.routers.marketone-store-app.tls.certResolver=letsencrypt"
      - "traefik.http.routers.marketone-store-app.service=marketone-store"
      - "traefik.http.services.marketone-store.loadbalancer.server.port=3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - dokploy

networks:
  internal:
    driver: bridge
  dokploy:
    external: true
    name: dokploy-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
